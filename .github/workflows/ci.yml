name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # The reference solutions are also run in real Python, the same version Pyodide runs in the browser.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: npm ci
      - run: npm test
      - run: npm run build
